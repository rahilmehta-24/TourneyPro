name: Production Database Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-production:
    name: Migrate & Sync Production Database
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Database Migration on Supabase
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        FLASK_APP: run.py
      run: |
        export DATABASE_URL=$(echo -n "$DATABASE_URL" | tr -d '\r\n' | xargs)
        if [ -z "$DATABASE_URL" ]; then
          echo "[Error] DATABASE_URL secret is not configured in GitHub repository secrets."
          exit 1
        fi
        echo "Applying pending migrations to Production Supabase..."
        flask db upgrade
        echo "Production migration completed successfully!"

    - name: Compare & Synchronize Schema with Supabase
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        FLASK_APP: run.py
      run: |
        export DATABASE_URL=$(echo -n "$DATABASE_URL" | tr -d '\r\n' | xargs)
        echo "Comparing database models against Supabase production schema..."
        python scripts/sync_db_schema.py
