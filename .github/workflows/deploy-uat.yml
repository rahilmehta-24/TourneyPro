name: UAT Database Migration

on:
  push:
    branches:
      - uat
  workflow_dispatch:

concurrency:
  group: deploy-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-uat:
    name: Migrate & Sync UAT Database
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/uat'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Database Migration on UAT Supabase
      env:
        DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
        FLASK_APP: run.py
      run: |
        export DATABASE_URL=$(echo -n "$DATABASE_URL" | tr -d '\r\n' | xargs)
        if [ -z "$DATABASE_URL" ]; then
          echo "[Error] UAT_DATABASE_URL secret is not configured in GitHub repository secrets."
          echo "[Error] Halting workflow to prevent accidental modifications to Production."
          echo "Please configure 'UAT_DATABASE_URL' in GitHub Repo Settings -> Secrets and variables -> Actions."
          exit 1
        fi
        echo "Applying pending migrations to UAT Supabase..."
        flask db upgrade
        echo "UAT Migration completed successfully!"

    - name: Compare & Synchronize Schema with UAT Supabase
      env:
        DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
        FLASK_APP: run.py
      run: |
        export DATABASE_URL=$(echo -n "$DATABASE_URL" | tr -d '\r\n' | xargs)
        if [ -z "$DATABASE_URL" ]; then
          echo "[Error] UAT_DATABASE_URL secret is not configured in GitHub repository secrets."
          exit 1
        fi
        echo "Comparing database models against UAT Supabase schema..."
        python scripts/sync_db_schema.py
