{% extends "base.html" %}

{% block title %}Join {{ academy.name }} - TourneyPro{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body text-center p-5">
                    <h2 class="mb-3">Join {{ academy.name }}</h2>
                    <p class="text-muted mb-4">By joining this academy, you will gain access to its internal announcements and tournaments.</p>
                    
                    <form method="POST" action="{{ url_for('academy.join', slug=academy.url_slug) }}">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Join Academy Now</button>
                            <a href="{{ url_for('academy.dashboard', slug=academy.url_slug) }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
