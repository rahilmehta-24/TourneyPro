{% extends "base.html" %}

{% block title %}Create Academy - The Baseline Society{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); overflow: hidden;">
                <div class="card-header p-4" style="background: var(--gradient-court); color: #FFFFFF; border-bottom: 3px solid var(--accent-secondary);">
                    <h3 class="mb-0" style="color: #FFFFFF; font-family: var(--font-display); font-size: 1.65rem; font-weight: 600;">Create New Academy</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('academy.create') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Academy Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required minlength="3" maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="4" maxlength="500"></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Create Academy</button>
                            <a href="{{ url_for('academy.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
