<!-- Shared Match Management & Score Reporting Modal Component -->
<div id="matchManagementModal" class="glass-modal-overlay" onclick="if(event.target === this) closeMatchModal()" role="dialog" aria-modal="true" aria-labelledby="modalMatchHeading">
    <div class="glass-modal">
        <div class="glass-modal-header">
            <h3 id="modalMatchHeading">Match #<span id="modalMatchId"></span></h3>
            <button type="button" class="glass-modal-close" onclick="closeMatchModal()" aria-label="Close dialog">&times;</button>
        </div>

        <div class="glass-modal-body">
            <div class="glass-modal-form-group">
                <label for="modalMatchStatus">Match Status</label>
                <select id="modalMatchStatus" onchange="handleStatusChange(this.value)">
                    <option value="pending">Pending</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                <div id="modalMatchStatusText" style="display: none; padding: 0.75rem; background: rgba(0,0,0,0.2); border-radius: var(--radius-md); font-weight: 500; font-size: 1.05rem; color: var(--text-primary); border: 1px solid rgba(255,255,255,0.05);"></div>
            </div>
            
            <div class="glass-modal-form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                <div style="flex-grow: 1;">
                    <label for="modalMatchTime">Scheduled Time</label>
                    <input type="datetime-local" id="modalMatchTime" style="width: 100%;">
                </div>
                <button type="button" id="saveTimeBtn" class="glass-btn-primary" onclick="saveDateTimeOnly()" style="padding: 0.75rem; height: 42px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px;" title="Save Date & Time" aria-label="Save Date & Time">✔️</button>
            </div>
            
            <form id="reportForm" style="display: none; margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
                <div class="glass-modal-form-group" style="margin-bottom: 1.5rem; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: var(--radius-md);">
                    <label style="font-weight: 600; margin-bottom: 0.5rem; display: block; color: var(--text-primary);">Match Scoring Override (Optional)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">Scoring Format</label>
                            <select id="modalMatchFormat" name="scoring_format" class="form-input" style="width: 100%;" onchange="toggleModalMatchFormat()">
                                <option value="games">Games (Sets & Games)</option>
                                <option value="points">Points (Single Target)</option>
                            </select>
                        </div>
                        <div id="modalPointsFields" style="display: none;">
                            <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">Points to Win</label>
                            <input type="number" id="modalMatchPointsToWin" name="points_to_win" min="1" max="100" class="form-input" style="width: 100%;">
                        </div>
                        <div id="modalGamesFields" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; grid-column: span 2;">
                            <div>
                                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">Num Sets</label>
                                <input type="number" id="modalMatchNumSets" name="num_sets" min="1" max="5" class="form-input" style="width: 100%;" onchange="updateVisibleSets(this.value)">
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">Games Per Set</label>
                                <input type="number" id="modalMatchGamesPerSet" name="games_per_set" min="1" max="10" class="form-input" style="width: 100%;">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label" style="display: block; margin-bottom: 1rem; font-weight: 600; font-size: 1.1rem;">Select Winner (If Completed)</label>
                    <div class="winner-options" style="display: flex; flex-direction: column; gap: 1rem;">
                        <label class="winner-option" style="display: flex; align-items: center; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-md); cursor: pointer;">
                            <input type="radio" name="winner_id" id="winner1" value="" style="margin-right: 1rem; width: 20px; height: 20px;">
                            <span id="winner1Label" style="font-size: 1.1rem; font-weight: 500;">Participant 1</span>
                        </label>
                        <label class="winner-option" style="display: flex; align-items: center; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-md); cursor: pointer;">
                            <input type="radio" name="winner_id" id="winner2" value="" style="margin-right: 1rem; width: 20px; height: 20px;">
                            <span id="winner2Label" style="font-size: 1.1rem; font-weight: 500;">Participant 2</span>
                        </label>
                    </div>
                </div>
                
                <label id="modalSetsLabel" class="form-label" style="font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; display: block;">Set Scores</label>
                
                <div id="modalPointsScore" style="display: none; margin-top: 1rem;">
                    <label class="form-label" style="font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; display: block;">Points Score</label>
                    <div style="display: flex; gap: 1rem; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: var(--radius-md);">
                        <div style="text-align: center;">
                            <span id="p1PointsHeader" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">P1</span>
                            <input type="number" id="points_p1" name="points_p1" min="0" max="200" class="form-input" style="width: 80px; text-align: center; font-size: 1.2rem; padding: 0.5rem;">
                        </div>
                        <span style="font-weight: bold; font-size: 1.2rem;">-</span>
                        <div style="text-align: center;">
                            <span id="p2PointsHeader" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">P2</span>
                            <input type="number" id="points_p2" name="points_p2" min="0" max="200" class="form-input" style="width: 80px; text-align: center; font-size: 1.2rem; padding: 0.5rem;">
                        </div>
                    </div>
                </div>
                
                <table id="modalSetsTable" style="width: 100%; border-collapse: collapse; margin-top: 0.5rem;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <th style="padding: 0.5rem; text-align: left; color: var(--text-secondary);">Set</th>
                            <th id="p1SetHeader" style="padding: 0.5rem; text-align: center; color: var(--text-secondary);">Player 1</th>
                            <th id="p2SetHeader" style="padding: 0.5rem; text-align: center; color: var(--text-secondary);">Player 2</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% set default_games_per_set = category.games_per_set if category else (tournament.games_per_set or 6) %}
                        {% for s in range(1, 6) %}
                        <tr id="setRow{{ s }}" style="border-bottom: 1px solid rgba(255,255,255,0.02);">
                            <td style="padding: 0.75rem 0.5rem; font-weight: bold; color: var(--text-secondary);">Set {{ s }}</td>
                            <td style="padding: 0.75rem 0.5rem; text-align: center;">
                                <input type="number" name="set{{ s }}_p1" id="set{{ s }}_p1" min="0" class="form-input" style="width: 60px; text-align:center; padding: 4px;" oninput="checkTiebreak({{ s }}, {{ default_games_per_set }})">
                            </td>
                            <td style="padding: 0.75rem 0.5rem; text-align: center;">
                                <input type="number" name="set{{ s }}_p2" id="set{{ s }}_p2" min="0" class="form-input" style="width: 60px; text-align:center; padding: 4px;" oninput="checkTiebreak({{ s }}, {{ default_games_per_set }})">
                            </td>
                        </tr>
                        <tr id="tbRow{{ s }}" style="display: none; background: rgba(255,165,0,0.1);">
                            <td style="padding: 0.5rem; color: #ffb74d; font-size: 0.85rem; text-align: right;">Tiebreak Pts:</td>
                            <td style="padding: 0.5rem; text-align: center;">
                                <input type="number" name="tb{{ s }}_p1" id="tb{{ s }}_p1" min="0" class="form-input" style="width: 60px; text-align:center; padding: 4px; border-color: #ffb74d;">
                            </td>
                            <td style="padding: 0.5rem; text-align: center;">
                                <input type="number" name="tb{{ s }}_p2" id="tb{{ s }}_p2" min="0" class="form-input" style="width: 60px; text-align:center; padding: 4px; border-color: #ffb74d;">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </form>
        </div>
        
        <div class="glass-modal-footer">
            <button type="button" class="glass-btn-secondary" onclick="closeMatchModal()">Cancel</button>
            <button type="button" id="savePendingBtn" class="glass-btn-primary" onclick="saveMatchAction('pending')">Save Changes</button>
            <button type="button" id="saveLiveBtn" class="glass-btn-warning" onclick="saveMatchAction('live_score')" style="display: none;">Save Live Score</button>
            <button type="button" id="completeMatchBtn" class="glass-btn-success" onclick="saveMatchAction('complete_match')" style="display: none;">Complete Match</button>
        </div>
    </div>
</div>

<script>
let currentManageMatchId = null;
let currentManageMatchIsAdmin = false;

function toggleModalMatchFormat() {
    const format = document.getElementById('modalMatchFormat').value;
    if (format === 'points') {
        document.getElementById('modalPointsFields').style.display = 'block';
        document.getElementById('modalGamesFields').style.display = 'none';
        document.getElementById('modalSetsTable').style.display = 'none';
        document.getElementById('modalSetsLabel').style.display = 'none';
        document.getElementById('modalPointsScore').style.display = 'block';
    } else {
        document.getElementById('modalPointsFields').style.display = 'none';
        document.getElementById('modalGamesFields').style.display = 'grid';
        document.getElementById('modalSetsTable').style.display = 'table';
        document.getElementById('modalSetsLabel').style.display = 'block';
        document.getElementById('modalPointsScore').style.display = 'none';
        updateVisibleSets(document.getElementById('modalMatchNumSets').value || {{ (category.num_sets if category else None) or tournament.num_sets or 3 }});
    }
}

function updateVisibleSets(numSets) {
    if (!numSets) numSets = {{ (category.num_sets if category else None) or tournament.num_sets or 3 }};
    for (let s = 1; s <= 5; s++) {
        const row = document.getElementById('setRow' + s);
        if (row) {
            row.style.display = (s <= numSets) ? 'table-row' : 'none';
        }
    }
}

async function saveDateTimeOnly() {
    if (!currentManageMatchId) return;
    const timeVal = document.getElementById('modalMatchTime').value;
    try {
        const res = await fetch(`/match/${currentManageMatchId}/schedule`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scheduled_time: timeVal })
        });
        const data = await res.json();
        if (data.success) {
            const btn = document.getElementById('saveTimeBtn');
            const originalText = btn.innerText;
            btn.innerText = '✅';
            setTimeout(() => { btn.innerText = originalText; }, 1500);
        } else {
            alert('Error updating schedule: ' + data.message);
        }
    } catch(err) {
        console.error(err);
        alert('Network error saving schedule');
    }
}

function checkTiebreak(setNum, targetGames) {
    const p1Input = document.getElementById('set' + setNum + '_p1');
    const p2Input = document.getElementById('set' + setNum + '_p2');
    const tbRow = document.getElementById('tbRow' + setNum);
    if (!p1Input || !p2Input || !tbRow) return;
    const v1 = parseInt(p1Input.value, 10);
    const v2 = parseInt(p2Input.value, 10);
    const limit = targetGames || 6;
    if (v1 === limit && v2 === limit) {
        tbRow.style.display = 'table-row';
    } else {
        tbRow.style.display = 'none';
    }
}

function handleStatusChange(status) {
    const reportForm = document.getElementById('reportForm');
    const savePendingBtn = document.getElementById('savePendingBtn');
    const saveLiveBtn = document.getElementById('saveLiveBtn');
    const completeMatchBtn = document.getElementById('completeMatchBtn');
    
    if (status === 'pending') {
        reportForm.style.display = 'none';
        savePendingBtn.style.display = 'inline-block';
        saveLiveBtn.style.display = 'none';
        completeMatchBtn.style.display = 'none';
    } else if (status === 'in_progress') {
        reportForm.style.display = 'block';
        savePendingBtn.style.display = 'none';
        saveLiveBtn.style.display = 'inline-block';
        completeMatchBtn.style.display = 'none';
    } else if (status === 'completed') {
        reportForm.style.display = 'block';
        savePendingBtn.style.display = 'none';
        saveLiveBtn.style.display = 'none';
        completeMatchBtn.style.display = 'inline-block';
    }
}

function openMatchModal(matchId, currentStatus, currentScheduledTime, p1Name, p1Id, p2Name, p2Id, isAdmin, score1, score2, matchFormat, matchNumSets, matchGamesPerSet, matchPointsToWin, winnerId, matchNumber) {
    try {
        currentManageMatchId = matchId;
        currentManageMatchIsAdmin = isAdmin;
        document.getElementById('modalMatchId').innerText = matchNumber || matchId;
        
        const statusSelect = document.getElementById('modalMatchStatus');
        statusSelect.value = currentStatus || 'pending';
        document.getElementById('modalMatchId').dataset.originalStatus = currentStatus;
        
        const statusText = document.getElementById('modalMatchStatusText');
        const statusMap = { 'pending': 'Pending', 'in_progress': 'In Progress', 'completed': 'Completed' };
        if (statusText) statusText.innerText = statusMap[currentStatus || 'pending'];
        
        const timeInput = document.getElementById('modalMatchTime');
        timeInput.value = (currentScheduledTime && currentScheduledTime !== 'None') ? currentScheduledTime : '';
        
        const form = document.getElementById('reportForm');
        const slug = '{{ tournament.url_slug }}';
        const catId = '{{ category.id if category else "null" }}';
        if (catId && catId !== 'null') {
            form.action = `/tournaments/${slug}/categories/${catId}/match/${matchId}/report`;
        } else {
            form.action = `/tournaments/${slug}/match/${matchId}/report`;
        }
        
        document.getElementById('winner1').value = p1Id || '';
        document.getElementById('winner2').value = p2Id || '';
        document.getElementById('winner1Label').innerText = p1Name || 'Participant 1';
        document.getElementById('winner2Label').innerText = p2Name || 'Participant 2';
        document.getElementById('p1SetHeader').innerText = p1Name || 'P1';
        document.getElementById('p2SetHeader').innerText = p2Name || 'P2';
        document.getElementById('p1PointsHeader').innerText = p1Name || 'P1';
        document.getElementById('p2PointsHeader').innerText = p2Name || 'P2';
        
        if (winnerId && winnerId == p1Id) document.getElementById('winner1').checked = true;
        else if (winnerId && winnerId == p2Id) document.getElementById('winner2').checked = true;
        else {
            document.getElementById('winner1').checked = false;
            document.getElementById('winner2').checked = false;
        }

        const formatSelect = document.getElementById('modalMatchFormat');
        formatSelect.value = matchFormat || '{{ (category.scoring_format if category else None) or "games" }}';
        const numSetsSelect = document.getElementById('modalMatchNumSets');
        numSetsSelect.value = matchNumSets || {{ (category.num_sets if category else None) or tournament.num_sets or 3 }};
        const gamesPerSetSelect = document.getElementById('modalMatchGamesPerSet');
        gamesPerSetSelect.value = matchGamesPerSet || {{ (category.games_per_set if category else None) or 6 }};
        const pointsToWinInput = document.getElementById('modalMatchPointsToWin');
        pointsToWinInput.value = matchPointsToWin || {{ (category.points_to_win if category else None) or 11 }};
        
        toggleModalMatchFormat();
        
        // Populate existing scores if present
        if (score1 && score1 !== 'N/A') {
            if (formatSelect.value === 'points') {
                document.getElementById('points_p1').value = score1 || '';
                document.getElementById('points_p2').value = score2 || '';
            } else {
                const s1Parts = String(score1).split(', ');
                s1Parts.forEach((st, idx) => {
                    const sNum = idx + 1;
                    if (sNum <= 5 && st.includes('-')) {
                        const games = st.split('-');
                        const g1 = games[0].split('(')[0];
                        const g2 = games[1].split('(')[0];
                        const s1Input = document.getElementById('set' + sNum + '_p1');
                        const s2Input = document.getElementById('set' + sNum + '_p2');
                        if (s1Input) s1Input.value = g1;
                        if (s2Input) s2Input.value = g2;
                        if (games[0].includes('(') || games[1].includes('(')) {
                            const tbRow = document.getElementById('tbRow' + sNum);
                            if (tbRow) tbRow.style.display = 'table-row';
                        }
                    }
                });
            }
        }
        
        handleStatusChange(currentStatus || 'pending');
        
        if (!isAdmin) {
            statusSelect.style.display = 'none';
            if (statusText) statusText.style.display = 'block';
            timeInput.disabled = true;
            document.getElementById('saveTimeBtn').style.display = 'none';
            form.querySelectorAll('input, select').forEach(el => el.disabled = true);
            document.getElementById('savePendingBtn').style.display = 'none';
            document.getElementById('saveLiveBtn').style.display = 'none';
            document.getElementById('completeMatchBtn').style.display = 'none';
        } else {
            statusSelect.style.display = 'block';
            if (statusText) statusText.style.display = 'none';
            timeInput.disabled = false;
            document.getElementById('saveTimeBtn').style.display = 'flex';
            form.querySelectorAll('input, select').forEach(el => el.disabled = false);
        }
        
        document.getElementById('matchManagementModal').classList.add('active');
    } catch(e) {
        console.error("Match modal error", e);
        alert("Error opening modal: " + e.message);
    }
}

function closeMatchModal() {
    document.getElementById('matchManagementModal').classList.remove('active');
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
        const modal = document.getElementById('matchManagementModal');
        if (modal && modal.classList.contains('active')) {
            closeMatchModal();
        }
    }
});

async function saveMatchAction(actionType) {
    if (!currentManageMatchIsAdmin) return;
    const scheduledTime = document.getElementById('modalMatchTime').value;
    
    // Schedule update
    if (scheduledTime) {
        try {
            await fetch(`/match/${currentManageMatchId}/schedule`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ scheduled_time: scheduledTime })
            });
        } catch(e) { console.error(e); }
    }
    
    if (actionType === 'pending') {
        try {
            const res = await fetch(`/match/${currentManageMatchId}/toggle-status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'pending' })
            });
            const data = await res.json();
            if (data.success) {
                window.location.reload();
            } else {
                alert('Status update error: ' + data.message);
            }
        } catch(e) {
            console.error(e);
            alert('Network error updating status');
        }
    } else {
        if (actionType === 'complete_match' && !validateWinnerSelected()) {
            return;
        }
        const form = document.getElementById('reportForm');
        const existingAction = form.querySelector('input[name="action"]');
        if (existingAction) existingAction.remove();
        
        const actionInput = document.createElement('input');
        actionInput.type = 'hidden';
        actionInput.name = 'action';
        actionInput.value = actionType;
        form.appendChild(actionInput);
        
        form.method = 'POST';
        if (form.requestSubmit) form.requestSubmit();
        else form.submit();
    }
}

function validateWinnerSelected() {
    const w1 = document.getElementById('winner1');
    const w2 = document.getElementById('winner2');
    if (!w1.checked && !w2.checked) {
        alert("Please select a winner to complete the match.");
        return false;
    }
    return true;
}

// ==========================================
// Team Tie Multi-Rubber Modal Implementation
// ==========================================
let currentTieId = null;

function closeTieModal() {
    const modal = document.getElementById('teamTieModal');
    if (modal) modal.classList.remove('active');
    currentTieId = null;
}

function openTieModalFromCard(tieId) {
    if (typeof categoryTiesData === 'undefined' || !categoryTiesData[tieId]) {
        console.error("Tie data not found for id:", tieId);
        alert("Tie data could not be loaded.");
        return;
    }
    const tie = categoryTiesData[tieId];
    currentTieId = tieId;

    document.getElementById('tieModalMatchNumber').innerText = tie.match_number || tie.id;
    document.getElementById('tieModalSubtitle').innerText = `${tie.team1.name} vs ${tie.team2.name} (Round ${tie.round}${tie.court ? ' • ' + tie.court : ''})`;
    document.getElementById('tieModalTeam1Name').innerText = tie.team1.name;
    document.getElementById('tieModalTeam2Name').innerText = tie.team2.name;
    document.getElementById('tieModalScore1').innerText = tie.score1 || '0';
    document.getElementById('tieModalScore2').innerText = tie.score2 || '0';

    const isAdmin = {{ 'true' if current_user and current_user.role in ['admin', 'superadmin'] else 'false' }};
    const t1Roster = (typeof categoryTeamsRosters !== 'undefined' && categoryTeamsRosters[tie.team1.id]) ? categoryTeamsRosters[tie.team1.id].members : [];
    const t2Roster = (typeof categoryTeamsRosters !== 'undefined' && categoryTeamsRosters[tie.team2.id]) ? categoryTeamsRosters[tie.team2.id].members : [];

    const container = document.getElementById('tieRubbersContainer');
    container.innerHTML = '';

    (tie.rubbers || []).forEach((r, idx) => {
        const rNum = r.rubber_number || (idx + 1);
        const isSingles = (r.rubber_type === 'singles' || rNum === 1);
        const rubberTitle = isSingles ? 'Rubber 1: Singles' : `Rubber ${rNum}: Doubles ${rNum - 1}`;

        // Parse existing scores
        let g1 = '', g2 = '', tb1 = '', tb2 = '';
        if (r.score1 && r.score1.includes('-')) {
            const parts = r.score1.split('-');
            g1 = parts[0].trim();
            if (parts[1].includes('(')) {
                g2 = parts[1].split('(')[0].trim();
                const tbVal = parts[1].split('(')[1].replace(')', '').trim();
                if (parseInt(g1) > parseInt(g2)) {
                    tb1 = '7'; tb2 = tbVal;
                } else {
                    tb2 = '7'; tb1 = tbVal;
                }
            } else {
                g2 = parts[1].trim();
            }
        }

        const buildOptions = (members, selectedId, placeholder) => {
            let html = `<option value="">-- ${placeholder} --</option>`;
            members.forEach(m => {
                const isSel = (selectedId && (m.player_id == selectedId || m.id == selectedId)) ? 'selected' : '';
                const tag = m.tier ? `[Tier ${m.tier}] ` : '';
                const roleTag = m.role ? ` (${m.role})` : '';
                html += `<option value="${m.player_id || m.id}" ${isSel}>${tag}${m.name}${roleTag}</option>`;
            });
            return html;
        };

        const card = document.createElement('div');
        card.style.background = 'rgba(0,0,0,0.3)';
        card.style.border = '1px solid rgba(255,255,255,0.08)';
        card.style.borderRadius = 'var(--radius-md)';
        card.style.padding = '1.25rem';

        card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem;">
                <div style="font-weight: 700; color: #38bdf8; font-size: 1.05rem;">
                    🎾 ${rubberTitle} <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">(Total 7 Games)</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    ${r.court ? `<span style="font-size: 0.8rem; color: var(--text-muted);">🏟️ ${r.court}</span>` : ''}
                    <span style="font-size: 0.8rem; padding: 2px 8px; border-radius: 9999px; ${r.status === 'completed' ? 'background: rgba(16,185,129,0.2); color: #10b981;' : (r.status === 'in_progress' ? 'background: rgba(239,68,68,0.2); color: #ef4444;' : 'background: rgba(255,255,255,0.05); color: var(--text-muted);')}">
                        ${r.status === 'completed' ? '✓ Completed' : (r.status === 'in_progress' ? '● Live' : 'Pending')}
                    </span>
                </div>
            </div>

            <!-- Lineups -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">
                        ${tie.team1.name} Lineup
                    </label>
                    <select id="rubber_${rNum}_p1_p1" class="form-input" style="width: 100%; margin-bottom: 0.5rem;" ${!isAdmin ? 'disabled' : ''}>
                        ${buildOptions(t1Roster, r.lineup_p1_player_id, isSingles ? 'Singles Player' : 'Player 1')}
                    </select>
                    ${!isSingles ? `
                    <select id="rubber_${rNum}_p1_p2" class="form-input" style="width: 100%;" ${!isAdmin ? 'disabled' : ''}>
                        ${buildOptions(t1Roster, r.lineup_p1_player2_id, 'Player 2')}
                    </select>` : ''}
                </div>
                <div>
                    <label style="display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">
                        ${tie.team2.name} Lineup
                    </label>
                    <select id="rubber_${rNum}_p2_p1" class="form-input" style="width: 100%; margin-bottom: 0.5rem;" ${!isAdmin ? 'disabled' : ''}>
                        ${buildOptions(t2Roster, r.lineup_p2_player_id, isSingles ? 'Singles Player' : 'Player 1')}
                    </select>
                    ${!isSingles ? `
                    <select id="rubber_${rNum}_p2_p2" class="form-input" style="width: 100%;" ${!isAdmin ? 'disabled' : ''}>
                        ${buildOptions(t2Roster, r.lineup_p2_player2_id, 'Player 2')}
                    </select>` : ''}
                </div>
            </div>

            <!-- Total 7 Games Score Entry -->
            <div style="background: rgba(0,0,0,0.25); border-radius: 6px; padding: 0.75rem 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
                    <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Quick 7-Game Result Presets:</span>
                    ${isAdmin ? `
                    <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                        <span style="font-size: 0.75rem; color: #10b981; margin-right: 2px; align-self: center;">${tie.team1.name.slice(0, 7)}:</span>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 7, 0)" style="padding: 2px 6px; font-size: 0.78rem;">7-0</button>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 6, 1)" style="padding: 2px 6px; font-size: 0.78rem;">6-1</button>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 5, 2)" style="padding: 2px 6px; font-size: 0.78rem;">5-2</button>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 4, 3)" style="padding: 2px 6px; font-size: 0.78rem;">4-3(tb)</button>
                        <span style="font-size: 0.75rem; color: #f59e0b; margin: 0 4px; align-self: center;">|</span>
                        <span style="font-size: 0.75rem; color: #38bdf8; margin-right: 2px; align-self: center;">${tie.team2.name.slice(0, 7)}:</span>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 3, 4)" style="padding: 2px 6px; font-size: 0.78rem;">3-4(tb)</button>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 2, 5)" style="padding: 2px 6px; font-size: 0.78rem;">2-5</button>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 1, 6)" style="padding: 2px 6px; font-size: 0.78rem;">1-6</button>
                        <button type="button" class="btn btn-sm" onclick="setPresetScore(${rNum}, 0, 7)" style="padding: 2px 6px; font-size: 0.78rem;">0-7</button>
                    </div>` : ''}
                </div>

                <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 0.5rem;">
                    <div style="text-align: center;">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 2px;">${tie.team1.name} Games</span>
                        <input type="number" id="rubber_${rNum}_g1" value="${g1}" min="0" max="7" class="form-input" style="width: 70px; text-align: center; font-size: 1.25rem; font-weight: 700; padding: 4px;" oninput="checkTieRubberTB(${rNum})" ${!isAdmin ? 'disabled' : ''}>
                    </div>
                    <span style="font-size: 1.4rem; font-weight: bold; color: var(--text-muted); margin-top: 1rem;">-</span>
                    <div style="text-align: center;">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 2px;">${tie.team2.name} Games</span>
                        <input type="number" id="rubber_${rNum}_g2" value="${g2}" min="0" max="7" class="form-input" style="width: 70px; text-align: center; font-size: 1.25rem; font-weight: 700; padding: 4px;" oninput="checkTieRubberTB(${rNum})" ${!isAdmin ? 'disabled' : ''}>
                    </div>
                </div>

                <!-- Tiebreak Row (appears on 4-3 / 3-4) -->
                <div id="rubber_${rNum}_tb_row" style="display: ${(g1 == 4 && g2 == 3) || (g1 == 3 && g2 == 4) || (g1 == 3 && g2 == 3) ? 'flex' : 'none'}; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 0.75rem; background: rgba(245,158,11,0.1); border: 1px dashed rgba(245,158,11,0.4); padding: 0.5rem; border-radius: 4px;">
                    <span style="font-size: 0.82rem; color: #fbbf24; font-weight: 600;">7-Point Tiebreak Points:</span>
                    <input type="number" id="rubber_${rNum}_tb1" value="${tb1}" min="0" max="99" placeholder="P1 TB" class="form-input" style="width: 60px; text-align: center; padding: 3px; border-color: #fbbf24;" ${!isAdmin ? 'disabled' : ''}>
                    <span style="color: #fbbf24; font-weight: bold;">:</span>
                    <input type="number" id="rubber_${rNum}_tb2" value="${tb2}" min="0" max="99" placeholder="P2 TB" class="form-input" style="width: 60px; text-align: center; padding: 3px; border-color: #fbbf24;" ${!isAdmin ? 'disabled' : ''}>
                </div>
            </div>
        `;

        container.appendChild(card);
    });

    if (!isAdmin) {
        document.getElementById('tieSaveLiveBtn').style.display = 'none';
        document.getElementById('tieCompleteBtn').style.display = 'none';
    } else {
        document.getElementById('tieSaveLiveBtn').style.display = 'inline-flex';
        document.getElementById('tieCompleteBtn').style.display = 'inline-flex';
    }

    document.getElementById('teamTieModal').classList.add('active');
}

function setPresetScore(rubberNum, g1, g2) {
    const input1 = document.getElementById(`rubber_${rubberNum}_g1`);
    const input2 = document.getElementById(`rubber_${rubberNum}_g2`);
    if (input1) input1.value = g1;
    if (input2) input2.value = g2;

    const tbRow = document.getElementById(`rubber_${rubberNum}_tb_row`);
    const tb1 = document.getElementById(`rubber_${rubberNum}_tb1`);
    const tb2 = document.getElementById(`rubber_${rubberNum}_tb2`);

    if ((g1 === 4 && g2 === 3) || (g1 === 3 && g2 === 4)) {
        if (tbRow) tbRow.style.display = 'flex';
        if (g1 === 4 && tb1 && (!tb1.value || tb1.value === '')) tb1.value = '7';
        if (g2 === 4 && tb2 && (!tb2.value || tb2.value === '')) tb2.value = '7';
        if (tb1 && !tb1.value) tb1.focus();
        else if (tb2 && !tb2.value) tb2.focus();
    } else {
        if (tbRow) tbRow.style.display = 'none';
        if (tb1) tb1.value = '';
        if (tb2) tb2.value = '';
    }
}

function checkTieRubberTB(rubberNum) {
    const g1 = parseInt(document.getElementById(`rubber_${rubberNum}_g1`)?.value || '0', 10);
    const g2 = parseInt(document.getElementById(`rubber_${rubberNum}_g2`)?.value || '0', 10);
    const tbRow = document.getElementById(`rubber_${rubberNum}_tb_row`);
    if (!tbRow) return;

    if ((g1 === 4 && g2 === 3) || (g1 === 3 && g2 === 4) || (g1 === 3 && g2 === 3)) {
        tbRow.style.display = 'flex';
    } else {
        tbRow.style.display = 'none';
    }
}

async function submitTieScores(action) {
    if (!currentTieId) return;
    const slug = '{{ tournament.url_slug }}';
    const catId = '{{ category.id if category else "null" }}';
    if (!catId || catId === 'null') {
        alert("Category ID missing.");
        return;
    }

    const payload = {
        action: action,
        rubber_1_p1_p1: document.getElementById('rubber_1_p1_p1')?.value || '',
        rubber_1_p2_p1: document.getElementById('rubber_1_p2_p1')?.value || '',
        rubber_1_g1: document.getElementById('rubber_1_g1')?.value || '',
        rubber_1_g2: document.getElementById('rubber_1_g2')?.value || '',
        rubber_1_tb1: document.getElementById('rubber_1_tb1')?.value || '',
        rubber_1_tb2: document.getElementById('rubber_1_tb2')?.value || '',

        rubber_2_p1_p1: document.getElementById('rubber_2_p1_p1')?.value || '',
        rubber_2_p1_p2: document.getElementById('rubber_2_p1_p2')?.value || '',
        rubber_2_p2_p1: document.getElementById('rubber_2_p2_p1')?.value || '',
        rubber_2_p2_p2: document.getElementById('rubber_2_p2_p2')?.value || '',
        rubber_2_g1: document.getElementById('rubber_2_g1')?.value || '',
        rubber_2_g2: document.getElementById('rubber_2_g2')?.value || '',
        rubber_2_tb1: document.getElementById('rubber_2_tb1')?.value || '',
        rubber_2_tb2: document.getElementById('rubber_2_tb2')?.value || '',

        rubber_3_p1_p1: document.getElementById('rubber_3_p1_p1')?.value || '',
        rubber_3_p1_p2: document.getElementById('rubber_3_p1_p2')?.value || '',
        rubber_3_p2_p1: document.getElementById('rubber_3_p2_p1')?.value || '',
        rubber_3_p2_p2: document.getElementById('rubber_3_p2_p2')?.value || '',
        rubber_3_g1: document.getElementById('rubber_3_g1')?.value || '',
        rubber_3_g2: document.getElementById('rubber_3_g2')?.value || '',
        rubber_3_tb1: document.getElementById('rubber_3_tb1')?.value || '',
        rubber_3_tb2: document.getElementById('rubber_3_tb2')?.value || ''
    };

    if (action === 'complete') {
        // Validate that at least some rubber scores were entered
        const anyScores = [payload.rubber_1_g1, payload.rubber_2_g1, payload.rubber_3_g1].some(g => g !== '');
        if (!anyScores) {
            alert("Please enter scores for the rubbers before completing the tie.");
            return;
        }
    }

    try {
        const res = await fetch(`/tournaments/${slug}/categories/${catId}/tie/${currentTieId}/report`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
            closeTieModal();
            window.location.reload();
        } else {
            alert('Error: ' + (result.error || 'Failed to update tie score.'));
        }
    } catch (err) {
        console.error(err);
        alert('Network error while saving tie score.');
    }
}
</script>

<!-- Team Tie Multi-Rubber Modal Component -->

                <h3 id="modalTieHeading" style="margin: 0; font-size: 1.35rem; font-weight: 700; color: #fff;">Tie #<span id="tieModalMatchNumber"></span></h3>

            </div>

        </div>

        <div class="glass-modal-body" style="overflow-y: auto; padding: 1.5rem; flex-grow: 1;">
            <!-- Overall Tie Scoreboard Header -->
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; background: rgba(0,0,0,0.35); padding: 1rem 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 1.5rem;">
                <div style="text-align: right;">
                    <div id="tieModalTeam1Name" style="font-size: 1.2rem; font-weight: 700; color: #f8fafc;">Team 1</div>

                </div>
                <div style="display: flex; align-items: center; gap: 0.75rem; background: rgba(0,0,0,0.5); padding: 0.5rem 1.25rem; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.1);">
                    <span id="tieModalScore1" style="font-size: 1.5rem; font-weight: 800; color: #38bdf8;">0</span>
                    <span style="color: var(--text-muted); font-weight: bold;">:</span>
                    <span id="tieModalScore2" style="font-size: 1.5rem; font-weight: 800; color: #38bdf8;">0</span>
                </div>
                <div style="text-align: left;">
                    <div id="tieModalTeam2Name" style="font-size: 1.2rem; font-weight: 700; color: #f8fafc;">Team 2</div>

                </div>
            </div>

            <!-- Rubbers Container -->
            <div id="tieRubbersContainer" style="display: flex; flex-direction: column; gap: 1.25rem;">

            </div>
        </div>

        <div class="glass-modal-footer" style="padding: 1.25rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end; gap: 0.75rem; background: rgba(0,0,0,0.2);">
            <button type="button" class="glass-btn-secondary" onclick="closeTieModal()">Cancel</button>
            <button type="button" id="tieSaveLiveBtn" class="glass-btn-warning" onclick="submitTieScores('live_score')" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                <span>●</span> Save Live Score
            </button>
            <button type="button" id="tieCompleteBtn" class="glass-btn-success" onclick="submitTieScores('complete')" style="display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 700;">
                <span>✓</span> Complete Tie
            </button>
        </div>
    </div>
</div>
