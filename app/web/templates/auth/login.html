{% extends "base.html" %}

{% block title %}Log In - The Baseline Society{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 0 auto; padding: var(--spacing-xl) var(--spacing-md);">
    <div class="form-section" style="background: var(--bg-card); padding: var(--spacing-lg); border: 1px solid var(--border-color); border-top: 4px solid var(--accent-secondary); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 0.75rem;">
            <img src="{{ url_for('static', filename='brand/monogram-on-light.svg') }}" alt="" width="48" height="50" style="display: inline-block; height: 48px; width: auto;">
        </div>
        <h2 class="form-section-title" style="font-family: var(--font-display); font-weight: 600; text-align: center; margin-bottom: var(--spacing-sm); font-size: 2.1rem; color: var(--text-primary);">Welcome Back</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: var(--spacing-lg);">Log in to manage your Lawn Tennis Tournaments</p>
        
        <form method="POST" data-turbo="false">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required placeholder="Enter username">
            </div>
            
            <div class="form-group" style="margin-bottom: var(--spacing-lg);">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block btn-large" style="margin-bottom: var(--spacing-md);">
                <span class="btn-icon">🔓</span> Log In
            </button>
        </form>
        
        <div style="text-align: center; margin-top: var(--spacing-md); color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
