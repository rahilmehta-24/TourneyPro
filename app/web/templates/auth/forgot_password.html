{% extends "base.html" %}

{% block title %}Reset Password - The Baseline Society{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 0 auto; padding: var(--spacing-xl) var(--spacing-md);">
    <div class="form-section" style="background: var(--bg-card); padding: var(--spacing-xl); border: 1px solid var(--border-color); border-top: 4px solid var(--accent-secondary); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <h2 style="font-family: var(--font-display); font-weight: 600; text-align: center; margin-bottom: 0.5rem; font-size: 1.85rem; color: var(--text-primary);">Forgot Password</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem;">Enter your email to receive a password reset link.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" data-turbo="false">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="email" class="form-label">Email Address *</label>
                <input type="email" id="email" name="email" class="form-input" required autocomplete="email" placeholder="you@example.com">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="width: 100%;">
                Send Password Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.25rem;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--accent-secondary); font-size: 0.9rem;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
