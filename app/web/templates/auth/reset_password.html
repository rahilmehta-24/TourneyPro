{% extends "base.html" %}

{% block title %}Set New Password - The Baseline Society{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 0 auto; padding: var(--spacing-xl) var(--spacing-md);">
    <div class="form-section" style="background: var(--bg-card); padding: var(--spacing-xl); border: 1px solid var(--border-color); border-top: 4px solid var(--accent-primary); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <h2 style="font-family: var(--font-display); font-weight: 600; text-align: center; margin-bottom: 0.5rem; font-size: 1.85rem; color: var(--text-primary);">Set New Password</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem;">Enter and confirm your new secure password.</p>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" data-turbo="false">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="password" class="form-label">New Password *</label>
                <input type="password" id="password" name="password" class="form-input" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password_confirm" class="form-label">Confirm New Password *</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-input" required minlength="8" autocomplete="new-password" placeholder="Re-enter your new password">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="width: 100%;">
                Update Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.25rem;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--accent-secondary); font-size: 0.9rem;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
